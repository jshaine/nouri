name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Chromium, WebKit and their system packages come preinstalled; the tag
    # must match the pinned @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.59.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint && npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests (coverage)
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: E2E (vite preview)
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
